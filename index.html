<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roman Spa Resort: Site Location</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#f1f4e4;--panel:#e6ecd0;--ink:#26261f;--mute:#5f5b48;--brown:#736a50;--rust:#a63310;
--serif:"Cormorant Garamond",Georgia,serif;--sans:"Jost","Century Gothic",Avenir,"Segoe UI",sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e15;--panel:#252a1c;--ink:#ecefdc;--mute:#b3b79b;--brown:#b5aa88;--rust:#e0704a}}
:root[data-theme="dark"]{--bg:#1b1e15;--panel:#252a1c;--ink:#ecefdc;--mute:#b3b79b;--brown:#b5aa88;--rust:#e0704a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(115deg,var(--panel),var(--bg) 65%);color:var(--ink);font:400 17px/1.55 var(--sans);padding:6vh 6vw;padding-top:calc(6vh + env(safe-area-inset-top,0px))}
.in{max-width:760px;margin:0 auto}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.2rem,7vw,3.2rem);margin:0 0 .3em}
.tag{display:inline-block;background:var(--rust);color:#fff;padding:4px 16px 4px 10px;clip-path:polygon(0 0,92% 0,100% 50%,92% 100%,0 100%);font-size:.85rem;margin-bottom:18px}
p{margin:0 0 1em;max-width:60ch}
.btn{display:inline-block;margin-top:10px;background:var(--rust);color:#fff;text-decoration:none;padding:12px 26px;border-radius:3px;font-weight:500}
.btn:hover{opacity:.9}
img,video{width:100%;border-radius:4px;display:block;margin:14px 0}
.fine{font-size:.82rem;color:var(--mute);margin-top:16px}
</style>
</head><body><div class="in">
<span class="tag">Location</span>
<h1>Site Location</h1><p>Bidadi, near Bengaluru, Karnataka, on SH17 leading to Mysuru.</p><a class="btn" href="https://maps.app.goo.gl/x3zacAQsBTEbHmJX8" target="_blank" rel="noopener">Open in Google Maps</a>
</div></body></html>
